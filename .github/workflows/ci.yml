name: VoicePaste CI

on:
  # Только основная ветка: на ветках ботов и предложений тот же прогон
  # уже идёт по pull_request, а по push у него нет ни прав, ни смысла —
  # 15 августа такой двойник упал на ветке Dependabot, хотя проверка
  # предложения была зелёной.
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: voicepaste-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Headless XCTest
        run: zsh scripts/test-safely.sh
      - name: Release app
        id: release
        run: |
          set -o pipefail
          path="$(zsh scripts/build-release.sh | tail -n 1)"
          echo "path=$path" >> "$GITHUB_OUTPUT"
      - name: Upload verified app
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: VoicePaste-${{ github.sha }}
          path: ${{ steps.release.outputs.path }}
          if-no-files-found: error
          retention-days: 7
